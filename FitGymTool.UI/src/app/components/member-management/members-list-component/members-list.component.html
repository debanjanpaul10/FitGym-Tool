<div
  class="members-list-card card shadow-m border-0 bg-dark"
  pRipple
  style="--p-ripple-background: rgba(75, 175, 80, 0.3)"
>
  <div class="members-data-table">
    <div
      class="filter-row"
      style="display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center"
    >
      <p-datepicker
        [(ngModel)]="selectedJoinDate"
        dateFormat="dd M yy"
        placeholder="Select join date"
        showIcon="true"
        (onSelect)="onJoinDateChange($event, dt)"
      ></p-datepicker>
      <p-select
        [options]="membershipStatusOptions"
        [(ngModel)]="selectedMembershipStatus"
        placeholder="Select membership status"
        optionLabel="label"
        optionValue="value"
        (onChange)="onMembershipStatusChange($event, dt)"
      ></p-select>
      <p-button
        type="button"
        icon="pi pi-times"
        [rounded]="true"
        [raised]="true"
        variant="outlined"
        severity="danger"
        (click)="clearFilters(dt)"
      ></p-button>
    </div>
    <p-table
      #dt
      [value]="sortedMembersData"
      [rows]="10"
      [paginator]="true"
      [columns]="columnHeaders"
      ngClass="members-table"
      showGridlines
      stripedRows
      [customSort]="true"
      (sortFunction)="customSort($event)"
    >
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns" pSortableColumn="{{ col.field }}">
            {{ col.header }}
            <p-sortIcon field="{{ col.field }}"></p-sortIcon>
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr>
          @for (col of columns; track col.field) {
          <td>
            @if (col.field === 'memberDateOfBirth' || col.field ===
            'memberJoinDate') {
            {{ rowData[col.field] | date : "d MMM yyyy" }}
            } @else {
            {{ rowData[col.field] }}
            }
          </td>
          }
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="columnHeaders.length" class="text-center py-4">
            <div class="empty-state">
              <i
                class="pi pi-search"
                style="font-size: 2rem; color: #6c757d"
              ></i>
              <p class="mt-2 mb-0">No results found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
